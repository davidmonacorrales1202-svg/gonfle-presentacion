<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comun.css">
<style>
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
.lienzo{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff}
.blob{position:absolute;border-radius:58% 42% 47% 53%/48% 55% 45% 52%}
.y1{width:360px;height:360px;right:-150px;top:-160px;background:var(--amarillo)}
.r1{width:120px;height:120px;right:150px;top:70px;background:var(--rojo)}

.top{position:relative;padding:48px 64px 0}
.top img{height:78px;margin-bottom:24px}
.ey{display:inline-block;background:var(--rojo);color:#fff;font-size:19px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px 18px;border-radius:999px;margin-bottom:18px}
.top h1{font-size:59px;font-weight:800;letter-spacing:-.035em;line-height:1.03;color:var(--tinta);max-width:820px}
.top h1 em{font-style:normal;color:var(--rojo)}
.top h1 u{text-decoration:none;color:var(--amarillo)}

.fotos{position:absolute;left:56px;right:56px;top:392px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.f{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 14px 30px rgba(30,22,48,.16)}
.f img{width:100%;height:100%;object-fit:cover;display:block}
.f.g{grid-column:span 3;height:304px}
.f.p{grid-column:span 2;height:262px}
.pill{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:10px;padding:9px 18px 9px 10px;border-radius:999px;font-size:22px;font-weight:700;letter-spacing:-.01em;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.pill i{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.pill i svg{width:22px;height:22px}
.pill.r{background:var(--rojo);color:#fff}.pill.r i svg{color:var(--rojo)}
.pill.a{background:var(--amarillo);color:var(--tinta)}.pill.a i svg{color:#B36A00}

.base{position:absolute;left:0;right:0;bottom:0;height:356px}
.base svg.ola{position:absolute;left:0;top:0;width:100%;height:120px}
.base .fondo{position:absolute;left:0;right:0;top:100px;bottom:0;background:var(--rojo)}
.base .y2{width:260px;height:260px;left:-110px;bottom:-150px;background:var(--amarillo)}
.contenido{position:absolute;left:64px;right:64px;top:122px;bottom:40px;display:grid;grid-template-columns:1fr 196px;gap:36px;align-items:center}
.contenido h2{color:#fff;font-size:48px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.wa-btn{display:inline-flex;align-items:center;gap:14px;background:#fff;color:var(--tinta);border-radius:999px;padding:12px 28px 12px 14px;font-size:32px;font-weight:700}
.wa-btn i{width:48px;height:48px;border-radius:50%;background:var(--wa);display:grid;place-items:center}
.wa-btn svg{width:28px;height:28px;color:#fff}
.mail{margin-top:14px;display:flex;align-items:center;gap:12px;color:#fff;font-size:24px;font-weight:500}
.mail svg{width:28px;height:28px;flex:none}
.qr{background:#fff;border-radius:22px;padding:14px 14px 10px;text-align:center;font-size:17px;font-weight:700;color:var(--tinta)}
.qr img{width:100%;display:block;margin-bottom:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-regalo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 9h16v4H4zm1.5 4V20h13v-7M12 9v11M12 9S10.5 4.5 8 5s-1 4 4 4Zm0 0s1.5-4.5 4-4 1 4-4 4Z"/></symbol>
  <symbol id="i-catering" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3 17h18M5 17a7 7 0 0 1 14 0M12 8V6.5M10.5 6.5h3M2.5 20h19"/></symbol>
  <symbol id="i-inflable" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3 20V12a9 9 0 0 1 18 0v8M7 20v-8a5 5 0 0 1 10 0v8M2 20h5m10 0h5"/></symbol>
  <symbol id="i-megafono" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 10v4h3l8 4V6l-8 4zm15-1a4 4 0 0 1 0 6M8 14v4a1.5 1.5 0 0 0 3 0v-2.5"/></symbol>
  <symbol id="i-salud" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.5h2.2l1.3-2.3 2 4.3 1.3-2h2.2"/></symbol>
  <symbol id="i-estrella" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
  <symbol id="i-medida" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 16 16 4l4 4L8 20H4zM13 7l4 4M10 10l2 2M7 13l2 2"/></symbol>
  <symbol id="i-aliado" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-6 9a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5a6 6 0 0 1 3 5.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="m8.3 12.3 2.5 2.5 4.9-5"/></symbol>
  <symbol id="i-calendario" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v14H4zM4 10h16M8 3.5V7m8-3.5V7M8 14h2m4 0h2m-8 3h2"/></symbol>
  <symbol id="i-tel" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1Z"/></symbol>
  <symbol id="i-correo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3.5 6h17v12h-17zm0 .5L12 13l8.5-6.5"/></symbol>
  <symbol id="i-ubicacion" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Zm0-8.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></symbol>
  <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.46 15.06L2 22l5.08-1.53A9.9 9.9 0 1 0 12.04 2Zm0 1.8a8.1 8.1 0 1 1-4.3 14.98l-.3-.19-3 .9.92-2.92-.2-.31A8.1 8.1 0 0 1 12.04 3.8Zm-3.3 3.9c-.2 0-.5.07-.76.36-.26.28-1 1-1 2.4s1.03 2.78 1.17 2.97c.14.19 2 3.18 4.93 4.33 2.43.96 2.93.77 3.46.72.53-.05 1.7-.7 1.94-1.37.24-.67.24-1.25.17-1.37-.07-.12-.26-.19-.55-.33-.29-.15-1.7-.84-1.96-.94-.27-.1-.46-.14-.65.15-.2.28-.75.93-.92 1.12-.17.2-.34.22-.63.08-.29-.15-1.22-.45-2.32-1.44a8.7 8.7 0 0 1-1.6-2c-.17-.3-.02-.45.13-.6.13-.13.29-.34.43-.5.15-.18.2-.3.29-.5.1-.19.05-.36-.02-.5-.07-.15-.64-1.58-.9-2.16-.22-.52-.46-.52-.65-.53h-.56Z"/></symbol>
</svg>
<div class="lienzo">
  <span class="blob y1"></span><span class="blob r1"></span>
  <div class="top">
    <img src="../assets/img/logo-gonfle.png" alt="Gonflé">
    <div><span class="ey">Soluciones para empresas</span></div>
    <h1>Más que productos, <em>experiencias</em> <u>que conectan.</u></h1>
  </div>

  <div class="fotos">
    <div class="f g"><img src="../assets/img/foto-regalos.webp" alt=""><span class="pill r"><i><svg><use href="#i-regalo"/></svg></i>Regalos corporativos</span></div>
    <div class="f g"><img src="../assets/img/foto-catering.webp" alt=""><span class="pill a"><i><svg><use href="#i-catering"/></svg></i>Catering empresarial</span></div>
    <div class="f p"><img src="../assets/img/foto-inflables.webp" alt=""><span class="pill r"><i><svg><use href="#i-inflable"/></svg></i>Inflables</span></div>
    <div class="f p"><img src="../assets/img/foto-merch.webp" alt=""><span class="pill a"><i><svg><use href="#i-megafono"/></svg></i>Merchandising</span></div>
    <div class="f p"><img src="../assets/img/foto-salud.webp" alt=""><span class="pill r"><i><svg><use href="#i-salud"/></svg></i>Bienestar</span></div>
  </div>

  <div class="base">
    <svg class="ola" viewBox="0 0 1080 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70 C 260 10, 520 10, 760 50 S 1000 110, 1080 60 L1080 120 L0 120 Z" fill="#F6A416"/>
      <path d="M0 95 C 280 40, 540 40, 780 75 S 1010 125, 1080 90 L1080 120 L0 120 Z" fill="#E51D3F"/>
    </svg>
    <div class="fondo"></div>
    
    <div class="contenido">
      <div>
        <h2>¡Conversemos!</h2>
        <div class="wa-btn"><i><svg><use href="#i-wa"/></svg></i>312 757 6447</div>
        <div class="mail"><svg><use href="#i-correo"/></svg>gerencia@gonflegroup.com</div>
      </div>
      <div class="qr"><img src="../assets/img/qr.svg" alt="">Conoce más</div>
    </div>
  </div>
</div>
</body>
</html>
