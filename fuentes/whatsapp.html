<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comun.css">
<style>
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
.lienzo{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.top{background:var(--morado-osc);padding:70px 76px 64px;position:relative;overflow:hidden;color:#D8CEE8}
.blob{position:absolute;border-radius:58% 42% 47% 53%/48% 55% 45% 52%}
.top .a{width:380px;height:380px;right:-120px;top:-150px;background:var(--amarillo)}
.top .b{width:200px;height:200px;right:190px;bottom:-130px;background:var(--rojo)}
.top img{height:88px;margin-bottom:46px;position:relative}
.top h1{color:#fff;font-size:68px;font-weight:800;letter-spacing:-.035em;line-height:1.05;position:relative;max-width:820px}
.top h1 em{font-style:normal;color:var(--amarillo)}
.lista{padding:52px 76px 0;display:grid;gap:20px}
.it{display:flex;align-items:center;gap:26px;font-size:34px;font-weight:600;color:var(--tinta);letter-spacing:-.01em}
.it .ico{width:78px;height:78px;border-radius:22px}
.base{margin-top:auto;background:var(--rojo);padding:42px 76px;display:flex;align-items:center;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.base .c{width:260px;height:260px;left:-90px;bottom:-170px;background:var(--amarillo)}
.base>div{position:relative}
.base h2{color:#fff;font-size:50px;font-weight:800;margin-bottom:10px}
.base p{color:#FFE4E9;font-size:30px;font-weight:500;display:flex;align-items:center;gap:14px}
.base p svg{width:38px;height:38px}
.qr{background:#fff;border-radius:24px;padding:16px;width:220px;text-align:center;font-size:19px;font-weight:600;color:var(--tinta);line-height:1.25}
</style>
</head>
<body>

  <symbol id="i-catering" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3 17h18M5 17a7 7 0 0 1 14 0M12 8V6.5M10.5 6.5h3M2.5 20h19"/></symbol>

  <symbol id="i-megafono" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 10v4h3l8 4V6l-8 4zm15-1a4 4 0 0 1 0 6M8 14v4a1.5 1.5 0 0 0 3 0v-2.5"/></symbol>

  <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></symbol>

</svg>
<div class="lienzo">
  <div class="top">
    <span class="blob a"></span><span class="blob b"></span>
    <img src="../assets/img/logo-gonfle-blanco.png" alt="Gonflé">
    <h1>Más que productos, <em>experiencias que conectan.</em></h1>
  </div>
  <div class="lista">
    <div class="it"><span class="ico c-rojo"><svg><use href="#i-regalo"/></svg></span>Regalos corporativos y cajas de Navidad</div>
    <div class="it"><span class="ico c-amarillo"><svg><use href="#i-catering"/></svg></span>Catering empresarial</div>
    <div class="it"><span class="ico c-rojo"><svg><use href="#i-inflable"/></svg></span>Inflables y activaciones de marca</div>
    <div class="it"><span class="ico c-amarillo"><svg><use href="#i-megafono"/></svg></span>Publicidad y merchandising</div>
    <div class="it"><span class="ico c-morado"><svg><use href="#i-salud"/></svg></span>Semana de la Salud y Bienestar</div>
  </div>
  <div class="base">
    <span class="blob c"></span>
    <div>
      <h2>¡Conversemos!</h2>
      <p><svg><use href="#i-wa"/></svg>(+57) 312 757 6447</p>
      <p style="font-size:26px;margin-top:6px">gerencia@gonflegroup.com</p>
    </div>
    <div class="qr"><img src="../assets/img/qr.svg" alt="">Ver presentación</div>
  </div>
</div>
</body>
</html>
