<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comun.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.l{width:1200px;height:630px;background:var(--morado-osc);position:relative;overflow:hidden;padding:72px 80px;color:#D8CEE8}
.blob{position:absolute;border-radius:58% 42% 47% 53%/48% 55% 45% 52%}
.a{width:520px;height:520px;right:-140px;top:-180px;background:var(--amarillo)}
.b{width:240px;height:240px;right:260px;bottom:-150px;background:var(--rojo)}
img{height:82px;position:relative;margin-bottom:48px}
h1{color:#fff;font-size:64px;font-weight:800;letter-spacing:-.035em;line-height:1.05;max-width:760px;position:relative}
h1 em{font-style:normal;color:var(--amarillo)}
p{position:relative;font-size:26px;margin-top:24px}
</style>
</head>
<body>
<div class="l">
  <span class="blob a"></span><span class="blob b"></span>
  <img src="../assets/img/logo-gonfle-blanco.png" alt="">
  <h1>Más que productos, <em>experiencias que conectan.</em></h1>
  <p>Presentación comercial · Agenda una cita</p>
</div>
</body>
</html>
